<!-- Questo file contiene il form per reimpostare la password -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recupero Password - GamesHub</title>
    <link rel="icon" href="immagini/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="login.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="immagini/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="form-container">
        <h2 class="login-title">Recupero Password</h2>

        <form class="form" id="forgotPasswordForm">
            <div class="flex-column">
                <label>Username</label>
            </div>
            <div class="inputForm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32">
                    <path d="M30.853 13.87A15 15 0 0 0 1.124 17.952a15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zM16 22a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"/>
                </svg>
                <input type="text" name="username" placeholder="Inserisci username" class="input" id="username"/>
            </div>

            <div class="flex-column">
                <label>Email</label>
            </div>
            <div class="inputForm">
                <input type="text" name="email" placeholder="Inserisci email" class="input" id="email"/>
            </div>

            <button class="button-submit" type="submit">Verifica</button>

            <p class="p">Password ricordata? <a href="login.html" class="span">Accedi</a><br>Torna alla home <a href="index.php" class="span">Home</a></p>
        </form>
        <div id="passwordContainer" style="display: none;"> </div>
        <script src="forgot_password.js"></script>
    </div>
</body>
</html>
