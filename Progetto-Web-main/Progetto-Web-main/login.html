<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GamesHub</title>

    <meta name="description" content="Accedi a GamesHub per salvare i tuoi punteggi, le preferenze e iniziare a giocare.">
    <meta name="keywords" content="Login, Accesso, Giochi, GamesHub">
    <meta name="author" content="Gruppo Sapienza DIAG">

    <link rel="icon" href="immagini/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="login.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="immagini/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="form-container">
        <h2 class="login-title">Login</h2>

        <form class="form" id="loginForm">
            <div class="flex-column">
                <label>Username</label>
            </div>
            <div class="inputForm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32">
                    <path d="M30.853 13.87A15 15 0 0 0 1.124 17.952a15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zM16 22a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"/>
                </svg>
                <input type="text" name="username" placeholder="Username" class="input" id="username" />
            </div>

            <div class="flex-column">
                <label>Password</label>
            </div>
            <div class="inputForm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="-64 0 512 512" height="20">
                    <path d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"/>
                    <path d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"/>
                </svg>
                <input type="password" name="password" placeholder="Password" class="input" id="password" />
            </div>

            <div class="flex-row remember-me">
                <div>
                    <input type="checkbox" id="remember" name="remember" />
                    <label for="remember">Ricordami</label>
                </div>
                <a href="forgot_password.html" class="forgot-password">Password dimenticata?</a>
            </div>

            <button class="button-submit" type="button" id="loginButton">Login</button>

            <p class="p">Non hai un account? <a href="register.html" class="span">Registrati</a><br>
            Torna indietro <a href ="index.php" class ="span" >Qui</a></p>
        </form>
        <script src="alert_login.js"></script>
    </div>
</body>
</html>
